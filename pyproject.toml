[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dental-rag-evaluation"
version = "0.1.0"
description = "Source-backed dental RAG with reproducible retrieval experiments"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "qdrant-client>=1.15,<2", "fastembed>=0.7,<1",
  "rank-bm25>=0.2.2,<0.3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
  "pydantic-settings>=2.5,<3", "httpx>=0.27,<1", "python-dotenv>=1,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
cloud = ["openai>=1.60,<3", "langfuse>=3,<5"]
eval = ["deepeval>=3,<5"]

[project.scripts]
dental-rag = "dental_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dental_rag = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
